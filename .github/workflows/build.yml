name: Build Extension

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository utama
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Inisialisasi dan tarik Git Submodule secara eksplisit (Pencegah error 'lib/appinventor does not exist')
      - name: Checkout Git Submodules
        run: |
          git submodule init
          git submodule update --recursive

      # 3. Setup Java JDK 8 (Gunakan v4 untuk kompatibilitas Node runner terbaru)
      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # 4. Jalankan Ant Build
      - name: Run Ant Build
        run: ant

      # 5. Upload hasil berkas .aix
      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdmobEngine
          path: out/*.aix
