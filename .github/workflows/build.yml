name: Build Extension with Ant

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Supaya bisa di-run manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Kode dari Repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK 8 (Versi standar paling stabil untuk Ant build App Inventor)
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      # 3. Setup Apache Ant
      - name: Set up Ant
        uses: subosito/flutter-action@v2 # atau runner default ubuntu sudah ada ant
        continue-on-error: true

      # 4. Jalankan Proses Build menggunakan Ant
      - name: Build Extension
        run: |
          ant

      # 5. Upload Hasil .aix ke Artifacts
      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extension-AIX
          path: build/output/*.aix
