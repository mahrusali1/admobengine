name: Build AIX Extension

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Kode dari Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java JDK 11 (Diperlukan oleh Rush)
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      # 3. Install Rush CLI
      - name: Install Rush CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/shreyashsaitwal/rush-cli/main/scripts/install/install.sh | bash
          echo "$HOME/.rush/bin" >> $GITHUB_PATH

      # 4. Jalankan Proses Build Ekstensi
      - name: Build Extension with Rush
        run: rush build

      # 5. Upload Hasil .aix ke Artifacts GitHub (Bisa Langsung Diunduh)
      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdmobEngine-AIX
          path: out/*.aix
