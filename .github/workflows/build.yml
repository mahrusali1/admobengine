name: Build AIX Extension

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository beserta Git Submodules (folder appinventor dll)
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Java JDK 8 (Wajib Java 8 untuk Ant build FastBuilder App Inventor)
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      # 3. Setup Apache Ant
      - name: Set up Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      # 4. Beri izin eksekusi skrip (jika ada script .sh)
      - name: Grant Execute Permissions
        run: |
          chmod +x update-deps.sh upgrade-appinventor.sh || true

      # 5. Jalankan Ant Build
      - name: Build Extension with Ant
        run: ant

      # 6. Upload hasil .aix ke Artifacts
      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extension-AIX
          path: |
            build/output/*.aix
            out/*.aix
